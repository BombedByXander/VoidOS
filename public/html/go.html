      /* Keep the site shell out of the game viewport. */
      body.xandersarcade-game-player {
        background: #000 !important;
        --primary-color: rgb(30, 30, 30);
      }

      /* Xbox Edge has less GPU headroom than desktop browsers. Keep the
         controls responsive and let the game iframe own the compositor. */
      @media (pointer: coarse) {
        body.xandersarcade-game-player .navbar-proxy,
        body.xandersarcade-game-player #tab-bar {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }

        body.xandersarcade-game-player iframe {
          contain: strict;
        }
      }

      body.xandersarcade-game-player::before,
      body.xandersarcade-game-player::after,
      body.xandersarcade-game-player #blobs,
      body.xandersarcade-game-player #particles-js,
      body.xandersarcade-game-player #topography-background,
      body.xandersarcade-game-player .xandersarcade-cosmos,
      body.xandersarcade-game-player .xandersarcade-ocean-scene,
      body.xandersarcade-game-player .xandersarcade-volcanic-scene,
      body.xandersarcade-game-player .xandersarcade-forest-scene,
      body.xandersarcade-game-player .xandersarcade-campfire-scene,
      body.xandersarcade-game-player .xandersarcade-hacker-scene,
      body.xandersarcade-game-player .xandersarcade-heaven-scene {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .xandersarcade-game-player svg.lucide {
        display: block;
        width: 1em;
        height: 1em;
        stroke: currentColor;
        flex-shrink: 0;
      }

      .player-ui-toggle {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: color-mix(in srgb, var(--bg-2-color) 92%, transparent);
        color: var(--text-color);
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(12px);
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .player-ui-toggle:hover,
      .player-ui-toggle:focus-visible {
        color: var(--primary-color);
        background: var(--bg-2-color);
        transform: translateY(-1px);
      }

      #mobile-player-controls,
      .mobile-player-button {
        display: none;
      }

      body.xandersarcade-game-player.toolbar-collapsed .proxy-container,
      body.xandersarcade-game-player.toolbar-collapsed #tab-bar {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-110%);
      }

      .proxy-container,
      #tab-bar {
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      body.xandersarcade-game-player.toolbar-collapsed #frames iframe.active {
        height: 100vh;
      }

      body.xandersarcade-game-player.toolbar-collapsed #frames {
        top: 0;
      }

      body.xandersarcade-game-player.toolbar-collapsed .player-ui-toggle {
        color: var(--primary-color);
      }

      #frames {
        position: fixed;
        top: var(--player-toolbar-height, 115px);
        right: 0;
        bottom: 0;
        width: 100%;
        height: auto;
        overflow: hidden;
        transition: top 0.22s ease;
      }

      #game-loading {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        background: #000;
        color: var(--text-color);
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      #game-loading[hidden] {
        display: none;
      }

      .game-loading-card {
        display: grid;
        justify-items: center;
        gap: 10px;
        min-width: min(300px, calc(100vw - 40px));
        padding: 24px;
        border: 1px solid var(--border-color);
        border-radius: 18px;
        background: color-mix(in srgb, var(--bg-2-color) 86%, transparent);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .game-loading-card > span:last-of-type {
        color: var(--text-secondary-color);
        font-size: 0.9rem;
      }

      .game-loading-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, var(--primary-color) 25%, transparent);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: gameLoadingSpin 0.8s linear infinite;
      }

      @keyframes gameLoadingSpin {
        to { transform: rotate(360deg); }
      }

      body {
        overflow: hidden;
      }

      #tab-bar {
        display: flex;
        align-items: center;
        background: var(--bg-2-color);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-color);
        position: relative;
        z-index: 10;
      }

      #tabs {
        display: flex;
        gap: 8px;
        margin-right: 12px;
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--primary-color) transparent;
        padding: 2px 0;
      }

      #tabs::-webkit-scrollbar {
        height: 4px;
      }

      #tabs::-webkit-scrollbar-thumb {
        background: var(--primary-color);
        border-radius: 4px;
      }

      .tab {
        background: var(--bg-color);
        min-width: 150px;
        max-width: 200px;
        border: 1px solid var(--border-color);
        padding: 8px 12px;
        border-radius: var(--border-radius);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .tab::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--primary-color);
        transition: width 0.3s ease;
      }

      .tab:hover::before {
        width: 100%;
      }

      .tab:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
      }

      .tab.active {
        /* background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--accent-color)
        ); */
        background-color: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }

      .tab span {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        font-size: 14px;
      }

      .tab i.close {
        font-size: 11px;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        transition: all 0.2s ease;
        opacity: 0.7;
      }

      .tab i.close:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.1);
      }

      .tab.active i.close:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      #new-tab {
        margin-left: 4px;
        padding: 8px 12px;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      #new-tab:hover {
        transform: rotate(90deg) scale(1.1);
      }

      .navbar-proxy {
        background: var(--bg-2-color);
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-color);
        position: relative;
        z-index: 9;
      }

      .navbar-links {
        gap: 6px;
        align-items: center;
      }

      .navbar-link.pro {
        padding: 10px 12px !important;
        border-radius: var(--border-radius);
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .navbar-link.pro::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(146, 130, 251, 0.2);
        transform: translate(-50%, -50%);
        transition:
          width 0.3s ease,
          height 0.3s ease;
      }

      .navbar-link.pro:hover::before {
        width: 100%;
        height: 100%;
      }

      .navbar-link.pro:active {
        transform: scale(0.95);
      }

      #proxy-address {
        width: 100%;
        font-size: 15px;
        padding: 10px 16px;
        border-radius: calc(var(--border-radius) * 1.5);
        transition: all 0.2s ease;
        font-weight: 400;
      }

      #proxy-address:focus {
        box-shadow: 0 0 0 3px rgba(146, 130, 251, 0.2);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: none;
        border-radius: 0;
        background: var(--bg-color);
      }

      iframe.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #autocomplete {
        position: absolute;
        left: 130px;
        margin: 0 auto;
        margin-top: 10px;
        background: var(--bg-2-color);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);

        max-height: 240px;

      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #autocomplete div {
        padding: 10px 16px;
        cursor: pointer;
        display: flex;
        color: var(--text-color);
        transition: all 0.15s ease;
        font-size: 14px;

      #autocomplete div::before {
        content: "";

        left: 0;
        top: 0;
        width: 2px;
        height: 0;
        background: var(--primary-color);
        transition: height 0.2s ease;
      }

      #autocomplete div:hover::before,
      #autocomplete div.active::before {
        height: 100%;

      #autocomplete div:hover,
      #autocomplete div.active {
        background: linear-gradient(

          if (frame) frame.contentWindow.location.reload();
        });
        prxHome.addEventListener("click", () => {
          window.location.href = "/science";
        });
        prxInspect.addEventListener("click", () => {
          if (devTools === false) {
            const openEruda = () => {
              if (!window.eruda) return;
              window.eruda.init();
              window.eruda.show();
              devTools = true;
            };
            if (window.eruda) {
              openEruda();
            } else {
              const script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/eruda";
              script.onload = openEruda;
              document.head.appendChild(script);
            }
          } else {
            window.eruda?.destroy();
            devTools = false;
          }
        });

        const searchInput = document.getElementById("proxy-address");
        const autocompleteBox = document.getElementById("autocomplete");

        async function fetchSuggestions(query) {
          if (!query) {
            autocompleteBox.innerHTML = "";
            autocompleteBox.style.display = "none";
            return;
          }
          try {
            const res = await fetch(
              `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}`,
            );
            const suggestions = await res.json();
            autocompleteBox.innerHTML = "";
            if (suggestions.length === 0) {
              autocompleteBox.style.display = "none";
              return;
            }
            suggestions.forEach((s) => {
              const item = document.createElement("div");
              item.textContent = s.phrase;
              item.onclick = () => {
                searchInput.value = s.phrase;
                autocompleteBox.innerHTML = "";
                autocompleteBox.style.display = "none";
              };
              autocompleteBox.appendChild(item);
            });
            autocompleteBox.style.display = "block";
          } catch (err) {
            console.error("Autocomplete error:", err);
            autocompleteBox.style.display = "none";
          }
        }

        searchInput.addEventListener("input", (e) => {
          fetchSuggestions(e.target.value);
        });

        searchInput.addEventListener("keydown", async (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
              const frame = getActiveFrame();
              if (frame) {
                if (query.includes("cdn.jsdelivr.net/gh/BombedByXander/lib-backup@main/")) {
                  try {
                    await loadCdnGame(frame, query);
                    frame.dataset.originalUrl = query;
                  } catch (error) {
                    console.error("Error loading CDN game:", error);
                    setLoading(true, "Game could not load", "The CDN game file could not be opened.", true);
                  }
                } else {
                  let urlforprx;
                if (localStorage.getItem("proxy-backend") === "ultraviolet") {
                    try {
                      await prepareProxy();
                    } catch (error) {
                      showProxyStartupError(error);
                      return;
                    }
                    urlforprx = window.encodeAny(query);
                  } else {
                    try {
                      await prepareProxy();
                    } catch (error) {
                      showProxyStartupError(error);
                      return;
                    }
                    urlforprx = window.sjEncodeAndGo(query);
                  }
                  // normalize invalid encoder outputs (null, empty, lone '?', '/?')
                  if (!urlforprx || urlforprx === "?" || urlforprx === "/?") {
                    urlforprx = "/new";
                  }
                  // keep sessionStorage in sync so /go flow sees the same value
                  try {
                    sessionStorage.setItem("lpurl", urlforprx);
                    sessionStorage.setItem("rawurl", query);
                  } catch (e) {}
                  frame.src = urlforprx;
                  frame.dataset.originalUrl = query;
                }
              }
              autocompleteBox.innerHTML = "";
              autocompleteBox.style.display = "none";
            }
          }
        });

        document.addEventListener("click", (e) => {
          if (!autocompleteBox.contains(e.target) && e.target !== searchInput) {
            autocompleteBox.innerHTML = "";
            autocompleteBox.style.display = "none";
          }
        });

        const queryUrl = new URLSearchParams(window.location.search).get("url");
        const directFrame = new URLSearchParams(window.location.search).get("direct") === "1";
        const rawUrl = queryUrl || sessionStorage.getItem("rawurl");
        const lpUrl = queryUrl || sessionStorage.getItem("lpurl");
        let startUrl;

        if (directFrame) {
          startUrl = rawUrl || lpUrl || "/new";
        } else if (lpUrl) {
          if (lpUrl.includes("jsdelivr")) {
            startUrl = lpUrl;
          } else if (lpUrl.startsWith("/uv") || lpUrl.startsWith("/scramjet")) {
            startUrl = lpUrl;
          } else if (lpUrl.startsWith("http")) {
            if (localStorage.getItem("proxy-backend") === "ultraviolet") {
              startUrl = window.encodeAny?.(lpUrl) || "/new";
            } else {
              startUrl = window.sjEncodeAndGo?.(lpUrl) || "/new";
            }
          } else {
            // Static hosting: treat lpUrl as a relative path when possible.
            startUrl = lpUrl && lpUrl.startsWith("/") ? lpUrl : "/new";
          }
        } else {
          startUrl = "/new";
        }

        if (!directFrame && startUrl !== "/new" && !startUrl.includes("jsdelivr")) {
          try {
            await prepareProxy();
          } catch (error) {
            showProxyStartupError(error);
          }
        }

        createTab(startUrl, rawUrl || startUrl, directFrame);
      });
    </script>
