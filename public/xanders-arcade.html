<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoidOS</title>
    <style>
      :root {
        color-scheme: dark;
        font: 16px system-ui, sans-serif;
        background: #090810;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(440px, 100%);
        padding: 32px;
        border: 1px solid #343044;
        border-radius: 20px;
        background: #151320;
        box-shadow: 0 20px 70px #0008;
        text-align: center;
      }

      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 14px 0 8px; font-size: 1.7rem; }
      p { color: #c4c0d2; line-height: 1.55; }

      button {
        margin-top: 10px;
        padding: 12px 20px;
        border: 0;
        border-radius: 11px;
        background: #a58aff;
        color: #100d19;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { filter: brightness(1.1); }
      #status { min-height: 1.5em; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <img id="logo" alt="" />
      <h1>VoidOS</h1>
      <p>This HTML file opens the full live app in an about:blank window.</p>
      <button id="launch" type="button">Launch VoidOS</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const fallbackSite = "https://void-os-lime.vercel.app/";
      let siteUrl = fallbackSite;
      try {
        const referrer = new URL(document.referrer);
        if (referrer.protocol === "https:" || referrer.protocol === "http:") {
          siteUrl = new URL("/", referrer.origin).href;
        }
      } catch {}

      document.getElementById("logo").src = new URL("/media/xandersarcade-logo.png", siteUrl);

      function launch() {
        if (window.location.protocol === "about:") {
          const style = document.createElement("style");
          style.textContent = "html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{display:block;padding:0}body>iframe{display:block;width:100%;height:100%;border:0}";
          document.head.append(style);
          document.body.replaceChildren();
          const frame = document.createElement("iframe");
          frame.title = "VoidOS";
          frame.allow = "autoplay; clipboard-read; clipboard-write; fullscreen; gamepad";
          frame.allowFullscreen = true;
          frame.src = siteUrl;
          document.body.append(frame);
          return;
        }

        const siteWindow = window.open("about:blank#voidos", "_blank");
        const status = document.getElementById("status");
        if (!siteWindow) {
          status.textContent = "Your browser blocked the blank window. Allow pop-ups for this page, then try again.";
          return;
        }

        const siteDocument = siteWindow.document;
        siteDocument.open();
        siteDocument.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoidOS</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#090810}iframe{display:block}</style></head><body><iframe title="VoidOS" allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad; picture-in-picture" allowfullscreen></iframe></body></html>`);
        siteDocument.close();
        siteDocument.querySelector("iframe").src = siteUrl;
      }

      document.getElementById("launch").addEventListener("click", launch);
      window.addEventListener("load", () => window.setTimeout(launch, 0), { once: true });
    </script>
  </body>
</html>
